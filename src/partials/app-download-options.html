<div class="app-download-options">
  <div class="store-links">
    <a class="store-link" data-app-download="googlePlay" {{googlePlayAttrs}}>
      <svg class="store-icon-play" viewBox="0 0 30 32" aria-hidden="true"><path fill="#00b7ff" d="M2.6 1.3 17.2 16 2.6 30.7C2.2 30.3 2 29.7 2 29V3c0-.7.2-1.3.6-1.7Z"/><path fill="#00d26a" d="M2.6 1.3c.6-.6 1.6-.7 2.6-.1L22.4 11l-5.2 5Z"/><path fill="#ffc800" d="m22.4 11 5.2 3c1.4.8 1.4 3.2 0 4l-5.2 3-5.2-5Z"/><path fill="#ff3a44" d="m17.2 16 5.2 5L5.2 30.8c-1 .6-2 .5-2.6-.1Z"/></svg>
      <span><small>Get it on</small><strong>Google Play</strong></span>
      <span class="store-link-arrow" aria-hidden="true">↗</span>
    </a>
    <a class="store-link store-link--apk" data-app-download="apk" {{apkAttrs}}>
      <svg viewBox="0 0 28 32" aria-hidden="true"><path d="M14 3v17m-6-6 6 6 6-6M4 22v6h20v-6"/></svg>
      <span><small>Install directly</small><strong>Download APK</strong></span>
      <span class="store-link-arrow" aria-hidden="true">↓</span>

  </div>
  {{downloadStatus}}
</div>

<div class="app-download-options">
  <div class="store-links">
    {{#if apk}}
    <a class="store-link store-link--apk" data-app-download="apk" {{apkAttrs}}>
      <svg viewBox="0 0 28 32" aria-hidden="true"><path d="M14 3v17m-6-6 6 6 6-6M4 22v6h20v-6"/></svg>
      <span><small>Tap to download</small><strong>Android app</strong></span>
      <span class="store-link-arrow" aria-hidden="true">↓</span>
    </a>
    {{/if}}
    <a class="store-link" role="link" data-app-download="googlePlay" {{googlePlayAttrs}}>
      <svg class="store-icon-play" viewBox="0 0 30 32" aria-hidden="true"><path fill="#00b7ff" d="M2.6 1.3 17.2 16 2.6 30.7C2.2 30.3 2 29.7 2 29V3c0-.7.2-1.3.6-1.7Z"/><path fill="#00d26a" d="M2.6 1.3c.6-.6 1.6-.7 2.6-.1L22.4 11l-5.2 5Z"/><path fill="#ffc800" d="m22.4 11 5.2 3c1.4.8 1.4 3.2 0 4l-5.2 3-5.2-5Z"/><path fill="#ff3a44" d="m17.2 16 5.2 5L5.2 30.8c-1 .6-2 .5-2.6-.1Z"/></svg>
      <span><small>{{googlePlayLabel}}</small><strong>Google Play</strong></span>
      <span class="store-link-arrow" aria-hidden="true">{{googlePlayArrow}}</span>
    </a>
  </div>
  <button class="store-link store-link--ios" type="button" disabled aria-label="iOS app coming soon">
    <svg class="store-icon-apple" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.6 12.1c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.8-.9-3-.8-1.6.1-3.1 1.1-3.9 2.5-1.7 3-.4 7.5 1.2 9.9.8 1.2 1.7 2.4 3 2.3 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.1-1.2 2.9-2.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-3.1-1.2-3.1-4.6ZM15.2 5.4c.7-.9 1.3-2.1 1.2-3.4-1.1.1-2.4.7-3.2 1.6-.7.8-1.3 2-1.2 3.2 1.2.1 2.5-.6 3.2-1.4Z"/></svg>
    <span class="store-ios-name">iOS</span>
    <span class="store-ios-status">Coming soon</span>
  </button>
  {{downloadStatus}}
</div>
